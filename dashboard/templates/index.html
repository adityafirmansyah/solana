<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana — SOLUSDT Quantitative Research Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@10/dist/umd/klinecharts.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#fffbeb',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="text-slate-200 min-h-screen">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-[#0c121e]/80 backdrop-blur sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg shadow-[0_0_15px_rgba(245,158,11,0.2)]">
        ⚡
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-white tracking-wide">SOLANA</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-mono">MULTI-COIN LEAD-LAG</span>
        </div>
        <div class="text-[11px] text-slate-400">BTC/ETH Leaders ➔ SOL · AVAX · SUI · NEAR · DOGE · LINK Followers</div>
      </div>
    </div>

    <!-- Live indicator + Spot ticker + Filters -->
    <div class="flex items-center gap-4 text-xs font-mono">
      <div id="liveTicker" class="hidden md:flex items-center gap-3 px-3 py-1 rounded-lg bg-slate-900 border border-slate-800">
        <span class="text-slate-400 text-[11px]">SPOT SOL</span>
        <span id="tickerSpot" class="font-bold text-white tabular">$0.00</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-400 text-[11px]">CROSS-CHECK Δ</span>
        <span id="tickerBasis" class="tabular text-slate-300">+$0.00</span>
      </div>
      <a href="http://127.0.0.1:3003" target="_blank" class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 transition text-[11px] font-sans">
        <span>⚡ Testnet Terminal ($100 Bankroll · 10x Iso)</span>
        <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">Port 3003</span>
      </a>
      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>GATEWAY ONLINE</span>
      </div>
      <div id="serverTime" class="text-slate-400 hidden sm:block">--:--:-- WIB</div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">

    <!-- Main Model Navigation: Clean Separation between Technical Quant and Sentiment News -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2">
        <button onclick="switchMainTab('technical')" id="btnTabTech" class="flex items-center gap-2.5 px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-amber-500/40 bg-amber-500/10 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.15)]">
          <span>📊 Technical Quant Model</span>
          <span id="badgeTechCount" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">--</span>
        </button>
        <button onclick="switchMainTab('sentiment')" id="btnTabSent" class="flex items-center gap-2.5 px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white hover:border-slate-700">
          <span>📰 Sentiment & News Intelligence</span>
          <span id="badgeSentCount" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">--</span>
        </button>
      </div>

      <!-- Time Horizon Filter -->
      <div class="flex items-center gap-2 text-xs font-medium bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-[11px] px-1.5">Horizon:</span>
        <button onclick="setFilter('days', 1)" id="btn-days-1" class="filter-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white text-xs">24H</button>
        <button onclick="setFilter('days', 7)" id="btn-days-7" class="filter-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white text-xs">7D</button>
        <button onclick="setFilter('days', 30)" id="btn-days-30" class="filter-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white text-xs">30D</button>
        <button onclick="setFilter('days', null)" id="btn-days-all" class="filter-btn px-2.5 py-1 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 font-semibold text-xs">ALL TIME</button>
      </div>
    </div>

    <!-- VIEW 1: TECHNICAL QUANT MODEL -->
    <div id="viewTechnical" class="space-y-6">

    <!-- {{CHARTS}} -->
    <!-- {{TECHNICAL_KPIS}} -->
    <!-- {{SENTIMENT_VIEW}} -->
  <!-- {{DETAILS_MODAL}} -->
  <script src="/static/js/app_core.js"></script>
  <script src="/static/js/app_charts.js"></script>
  <script src="/static/js/app_tables.js"></script>
  <script src="/static/js/app_scorecard.js"></script>
  <script src="/static/js/app_modal.js"></script>
  <script src="/static/js/app_candles.js"></script>
  <script src="/static/js/app_indicators.js"></script>
  <script src="/static/js/app.js?v=20261020a"></script>
</body>
</html>
